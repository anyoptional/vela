name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: 格式检查（gofmt）
        run: test -z "$(gofmt -l . ./eureka ./goctl)"

      - name: core 模块（vet + race 测试）
        run: |
          go vet ./...
          go test -race ./... -count=1

      - name: eureka 模块（vet + race 测试）
        run: |
          cd eureka
          go vet ./...
          go test -race ./... -count=1

      - name: goctl 模块（vet + race 测试，含生成代码编译验证）
        run: |
          cd goctl
          go vet ./...
          go test -race ./... -count=1
